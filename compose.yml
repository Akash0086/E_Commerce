services:

  backend:
    build: .
    ports:
     - "3000:3000"

    env_file:
     - .env

    depends_on:
     - mongodb
     - mysql

  mongodb:
    image: mongo

    volumes:
      - mongo-data:/data/db

  mysql:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: e_commerce
      MYSQL_USER: akash
      MYSQL_PASSWORD: 123456

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mongo-data:
  mysql-data: