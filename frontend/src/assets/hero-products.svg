<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A collection of products: smartphone, headphones, smartwatch and sneaker" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="c"><circle cx="200" cy="200" r="198"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3b6fd8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#14224f" stop-opacity=".25"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <g clip-path="url(#c)">
    <circle cx="200" cy="200" r="198" fill="url(#bg)"/>
    <circle cx="200" cy="205" r="140" fill="none" stroke="#fff" stroke-opacity=".08"/>
    <circle cx="200" cy="205" r="95" fill="none" stroke="#fff" stroke-opacity=".08"/>

    <!-- floor shadow -->
    <ellipse cx="200" cy="352" rx="130" ry="12" fill="#020617" opacity=".35"/>

    <!-- smartwatch (right) -->
    <g filter="url(#sh)" transform="rotate(10 308 190)">
      <rect x="291" y="95" width="34" height="190" rx="12" fill="#1e293b"/>
      <rect x="281" y="158" width="54" height="64" rx="16" fill="#e2e8f0"/>
      <rect x="287" y="164" width="42" height="52" rx="11" fill="#0f172a"/>
      <circle cx="308" cy="190" r="12" fill="none" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="308" cy="190" r="4" fill="#38bdf8"/>
      <rect x="333" y="178" width="4" height="14" rx="2" fill="#94a3b8"/>
    </g>

    <!-- headphones (left) -->
    <g filter="url(#sh)" transform="rotate(-10 92 215)">
      <path d="M48 222 C48 128 136 128 136 222" fill="none" stroke="#f1f5f9" stroke-width="11" stroke-linecap="round"/>
      <rect x="34" y="208" width="28" height="56" rx="13" fill="url(#cup)"/>
      <rect x="122" y="208" width="28" height="56" rx="13" fill="url(#cup)"/>
      <rect x="40" y="218" width="8" height="36" rx="4" fill="#fff" opacity=".25"/>
      <rect x="128" y="218" width="8" height="36" rx="4" fill="#fff" opacity=".25"/>
    </g>

    <!-- smartphone (center) -->
    <g filter="url(#sh)" transform="rotate(-6 200 175)">
      <rect x="150" y="64" width="100" height="204" rx="20" fill="url(#phone)"/>
      <rect x="157" y="72" width="86" height="188" rx="14" fill="url(#screen)"/>
      <rect x="185" y="78" width="30" height="7" rx="3.5" fill="#0f172a" opacity=".75"/>
      <rect x="168" y="104" width="64" height="34" rx="8" fill="#fff" opacity=".9"/>
      <rect x="168" y="148" width="29" height="29" rx="8" fill="#fff" opacity=".6"/>
      <rect x="203" y="148" width="29" height="29" rx="8" fill="#fff" opacity=".6"/>
      <rect x="168" y="186" width="64" height="12" rx="6" fill="#fff" opacity=".45"/>
      <rect x="168" y="204" width="44" height="12" rx="6" fill="#fff" opacity=".3"/>
    </g>

    <!-- sneaker (front) -->
    <g filter="url(#sh)" transform="rotate(-4 200 320)">
      <path d="M112 338 L112 306 C140 306 158 292 170 270 L196 284 C226 300 268 298 290 322 L290 338 Z" fill="url(#shoe)"/>
      <path d="M170 270 L196 284 L182 300 L160 286 Z" fill="#fff" opacity=".25"/>
      <path d="M200 290 l12 -8 M214 296 l12 -8 M228 302 l12 -8" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
      <path d="M112 338 H290 V346 Q290 354 280 354 H122 Q112 354 112 346 Z" fill="#f8fafc"/>
    </g>

    <!-- sparkles -->
    <g fill="#fff" opacity=".85">
      <path d="M72 96 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
      <path d="M326 70 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
      <circle cx="350" cy="300" r="3"/>
      <circle cx="58" cy="318" r="2.5"/>
    </g>
  </g>
</svg>
